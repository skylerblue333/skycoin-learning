name: classroom-ci

on:
  push:
    branches:
      - product/115-skyclassroom-lane01
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
