name: CI

on:
  push:
    branches: [main, product/115-skyclassroom-lane01]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts --no-fund
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
